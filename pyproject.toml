[project]
name = "chest-disease-prediction-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rs6739171-hash", email = "rs6739171@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "dagshub>=0.7.3",
    "dvc>=3.67.1",
    "ensure==1.0.2",
    "flask>=2.3.3",
    "flask-cors>=6.0.5",
    "gdown>=6.5.1",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "mlflow==2.2.2",
    "numpy<1.24,>=1.22",
    "pandas>=2.0.0",
    "python-box==6.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "setuptools<70",
    "tensorflow==2.12.0",
    "tqdm>=4.70.1",
    "types-pyyaml>=6.0.12.20261113",
]

[project.scripts]
chest-disease-prediction-system = "chest_disease_prediction_system:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
